<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学びの動画ライブラリ｜長田絵里子</title>
<meta name="description" content="恋愛・夫婦関係の深層心理を、動画と音声でわかりやすく学べるライブラリ。">
<style>
:root{
  --pink:#e6337f;--pink-dark:#c81f68;--pink-soft:#fff1f6;--pink-line:#f7c6da;
  --text:#2b2b2b;--muted:#6b6b6b;--line:#ececec;--bg:#fafafa;--card:#fff;
  --shadow:0 2px 12px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Zen Kaku Gothic New",Meiryo,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-weight:700;font-size:1.05rem;white-space:nowrap}
.logo span{color:var(--pink)}
.search{flex:1;max-width:360px;margin-left:auto;position:relative}
.search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:999px;font-size:.95rem;background:var(--bg)}
.search input:focus{outline:2px solid var(--pink-line);border-color:var(--pink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.hd-cta{background:var(--pink);color:#fff;font-weight:700;font-size:.9rem;padding:9px 16px;border-radius:999px;white-space:nowrap}
@media(max-width:640px){.hd-cta{display:none}.logo{font-size:.95rem}}

/* category nav */
.cats{background:#fff;border-bottom:1px solid var(--line)}
.cats ul{display:flex;gap:4px;list-style:none;margin:0 auto;padding:0 16px;max-width:1120px;overflow-x:auto;scrollbar-width:none}
.cats ul::-webkit-scrollbar{display:none}
.cats button{border:0;background:none;padding:12px 14px;font:inherit;font-size:.92rem;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.cats button[aria-pressed="true"]{color:var(--pink);border-bottom-color:var(--pink);font-weight:700}

/* hero */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;padding:28px 0 8px}
.feat{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.feat .body{padding:16px 20px 20px}
.feat h2{margin:6px 0 6px;font-size:1.35rem;line-height:1.5}
.feat p{margin:0;color:var(--muted);font-size:.93rem}
.side h3,.sec-h{font-size:1.1rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.side h3::before,.sec-h::before{content:"";width:4px;height:1.1em;background:var(--pink);border-radius:2px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:28px 112px 1fr;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:8px;box-shadow:var(--shadow);cursor:pointer}
.rank .n{font-weight:700;color:var(--pink);text-align:center;font-size:1.1rem}
.rank .t{font-size:.88rem;line-height:1.45;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:860px){.hero{grid-template-columns:1fr}}

/* thumbnail */
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#f9c6da,#e6337f);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{position:absolute;left:10px;top:8px;color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.05em;opacity:.95}
.thumb .play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.thumb .play::after{content:"";border-left:16px solid var(--pink);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.rank .thumb .play{width:28px;height:28px}.rank .thumb .play::after{border-left-width:9px;border-top-width:6px;border-bottom-width:6px;margin-left:2px}
.rank .thumb .ph,.rank .thumb .dur{display:none}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:.75rem;padding:1px 6px;border-radius:4px}
.tag{display:inline-block;font-size:.75rem;color:var(--pink);background:var(--pink-soft);padding:2px 10px;border-radius:999px;font-weight:700}
.type{display:inline-block;font-size:.72rem;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:999px;margin-left:6px}

/* grid */
section{padding:32px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.card:focus-visible,.feat:focus-visible,.rank li:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.card .body{padding:12px 14px 16px;display:flex;flex-direction:column;gap:6px}
.card h4{margin:0;font-size:.98rem;line-height:1.5}
.card p{margin:0;color:var(--muted);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);padding:24px 0}

/* cta band */
.band{margin:48px 0 0;background:var(--pink-soft);border-top:1px solid var(--pink-line);border-bottom:1px solid var(--pink-line)}
.band .wrap{padding:36px 16px;text-align:center}
.band h3{margin:0 0 8px;font-size:1.25rem}
.band p{margin:0 0 20px;color:var(--muted)}
.btn{display:inline-block;background:var(--pink);color:#fff;font-weight:700;padding:14px 32px;border-radius:999px;box-shadow:0 4px 0 var(--pink-dark)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:28px 16px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:14px;overflow:hidden;width:100%;max-width:900px;max-height:92vh;overflow-y:auto}
.player{aspect-ratio:16/9;background:#000}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.player.audio{aspect-ratio:auto;padding:28px 20px;background:linear-gradient(135deg,#f9c6da,#e6337f)}
.player audio{width:100%}
.mbody{padding:16px 20px 22px}
.mbody h2{margin:8px 0;font-size:1.25rem;line-height:1.5}
.mbody p{margin:0;color:var(--muted);white-space:pre-wrap}
.close{position:absolute;top:14px;right:18px;background:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:1.4rem;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <a class="logo" href="./">学びの<span>動画</span>ライブラリ</a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="キーワードで探す" aria-label="キーワードで探す">
    </label>
    <a class="hd-cta" href="../">体験セッション</a>
  </div>
</header>

<nav class="cats" aria-label="カテゴリ"><ul id="cats"></ul></nav>

<main class="wrap">
  <div class="hero" id="hero"></div>
  <section>
    <h3 class="sec-h" id="list-title">新着</h3>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="band">
  <div class="wrap">
    <h3>動画で学んだことを、あなたの関係に。</h3>
    <p>深層心理分析の体験セッションで、あなた自身のパターンを一緒に紐解きます。</p>
    <a class="btn" href="../">体験セッションの詳細を見る</a>
  </div>
</div>
<footer>© 長田絵里子</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <button class="close" id="close" aria-label="閉じる">×</button>
  <div class="mbox">
    <div class="player" id="player"></div>
    <div class="mbody">
      <span class="tag" id="m-cat"></span>
      <h2 id="m-title"></h2>
      <p id="m-desc"></p>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ここに動画・音声を追加していきます（上にあるものほど新しい）
   url には次のどれかを入れてください：
   ・YouTube のURL      例 https://youtu.be/xxxxxxxx
   ・Googleドライブの共有URL 例 https://drive.google.com/file/d/xxxx/view
     （共有設定を「リンクを知っている全員」にしてください）
   ・サイト内のファイル  例 videos/intro.mp4 / audio/talk.mp3
   url が空のものは「準備中」として表示されます。
   thumb（サムネイル画像）は省略可。YouTubeは自動で取得します。
   ========================================================= */
const ITEMS = [
  { title:"なぜ同じような相手ばかり好きになるのか？ 深層心理から見る恋愛パターン",
    category:"恋愛", type:"動画", duration:"12:30", featured:true,
    desc:"気づくといつも似たタイプを選んでしまう…。その背景にある心のしくみを、NotebookLMの解説動画でわかりやすくまとめました。",
    url:"https://youtu.be/MtpCGvljZiA" },
  { title:"夫婦のすれ違いはどこから始まる？ 「言わなくてもわかって」の正体",
    category:"夫婦関係", type:"動画", duration:"9:45",
    desc:"期待と失望のくり返しが生まれる理由と、関係を立て直す最初の一歩。", url:"" },
  { title:"ラジオ：自己肯定感と恋愛の深い関係",
    category:"自己理解", type:"音声", duration:"18:20",
    desc:"通勤中や家事をしながら聞ける音声解説です。", url:"" },
  { title:"親との関係が今のパートナーシップに与える影響",
    category:"自己理解", type:"動画", duration:"14:05",
    desc:"子どもの頃に身につけた「愛され方」が、大人の恋愛にどう現れるのか。", url:"" },
  { title:"復縁したいときに最初にやるべきこと・やってはいけないこと",
    category:"恋愛", type:"動画", duration:"11:10",
    desc:"焦って動く前に知っておきたい、心の整え方。", url:"" },
  { title:"ケンカが増えたときに読み解きたい「本当の気持ち」",
    category:"夫婦関係", type:"音声", duration:"16:40",
    desc:"怒りの奥にある感情に目を向けると、会話が変わります。", url:"" },
  { title:"体験セッションでは何をするの？ 流れをご紹介",
    category:"セッション紹介", type:"動画", duration:"6:00",
    desc:"初めての方向けに、体験セッションの流れと受けた方の変化をご紹介します。", url:"" },
];
/* ランキング表示する動画（上の一覧の番号。0が一番上） */
const RANKING = [0, 1, 3, 2, 4];
</script>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function parse(url){
    if(!url) return {kind:"none"};
    let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
    if(m) return {kind:"youtube", id:m[1]};
    m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/);
    if(m) return {kind:"drive", id:m[1]};
    if(/\.(mp3|m4a|wav|ogg)(\?|$)/i.test(url)) return {kind:"audio", src:url};
    return {kind:"video", src:url};
  }
  function thumbHTML(it){
    const p = parse(it.url);
    const src = it.thumb || (p.kind==="youtube" ? `https://i.ytimg.com/vi/${p.id}/hqdefault.jpg` : "");
    const img = src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<div class="ph">${esc(it.type==="音声"?"🎧 AUDIO":"▶ VIDEO")}</div>`;
    const dur = it.duration ? `<span class="dur">${esc(it.url ? it.duration : "準備中")}</span>` : "";
    return `<div class="thumb">${img}<span class="play" aria-hidden="true"></span>${dur}</div>`;
  }
  const meta = it => `<div><span class="tag">${esc(it.category)}</span><span class="type">${esc(it.type)}</span></div>`;

  const cats = ["すべて", ...new Set(ITEMS.map(i=>i.category))];
  let cur = "すべて", q = "";

  $("#cats").innerHTML = cats.map(c=>`<li><button data-c="${esc(c)}" aria-pressed="${c===cur}">${esc(c)}</button></li>`).join("");
  $("#cats").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    cur = b.dataset.c;
    document.querySelectorAll("#cats button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    renderGrid();
  });
  $("#q").addEventListener("input", e=>{ q = e.target.value.trim(); renderGrid(); });

  function renderHero(){
    const fi = Math.max(0, ITEMS.findIndex(i=>i.featured));
    const f = ITEMS[fi];
    $("#hero").innerHTML = `
      <article class="feat" tabindex="0" data-i="${fi}">
        ${thumbHTML(f)}
        <div class="body">${meta(f)}<h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p></div>
      </article>
      <aside class="side">
        <h3>よく見られている動画</h3>
        <ol class="rank">${RANKING.filter(i=>ITEMS[i]).map((i,n)=>`
          <li tabindex="0" data-i="${i}"><span class="n">${n+1}</span>${thumbHTML(ITEMS[i])}<span class="t">${esc(ITEMS[i].title)}</span></li>`).join("")}
        </ol>
      </aside>`;
  }
  function renderGrid(){
    const list = ITEMS.map((it,i)=>({it,i})).filter(({it})=>
      (cur==="すべて" || it.category===cur) &&
      (!q || (it.title+it.desc+it.category).toLowerCase().includes(q.toLowerCase())));
    $("#list-title").textContent = q ? `「${q}」の検索結果` : (cur==="すべて" ? "新着" : cur);
    $("#grid").innerHTML = list.length ? list.map(({it,i})=>`
      <article class="card" tabindex="0" data-i="${i}">
        ${thumbHTML(it)}
        <div class="body">${meta(it)}<h4>${esc(it.title)}</h4><p>${esc(it.desc)}</p></div>
      </article>`).join("") : `<p class="empty">該当する動画が見つかりませんでした。</p>`;
  }

  const modal = $("#modal"), player = $("#player");
  let lastFocus = null;
  function open(i){
    const it = ITEMS[i]; if(!it) return;
    const p = parse(it.url);
    player.className = "player";
    if(p.kind==="youtube") player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${p.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(it.title)}"></iframe>`;
    else if(p.kind==="drive") player.innerHTML = `<iframe src="https://drive.google.com/file/d/${p.id}/preview" allow="autoplay; fullscreen" allowfullscreen title="${esc(it.title)}"></iframe>`;
    else if(p.kind==="audio"){ player.className="player audio"; player.innerHTML = `<audio controls autoplay src="${esc(p.src)}"></audio>`; }
    else if(p.kind==="video") player.innerHTML = `<video controls autoplay playsinline src="${esc(p.src)}"></video>`;
    else player.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#f9c6da,#e6337f);font-weight:700">この動画は準備中です</div>`;
    $("#m-cat").textContent = it.category;
    $("#m-title").textContent = it.title;
    $("#m-desc").textContent = it.desc || "";
    lastFocus = document.activeElement;
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    $("#close").focus();
  }
  function close(){
    modal.classList.remove("open");
    player.innerHTML = "";
    document.body.style.overflow = "";
    lastFocus && lastFocus.focus();
  }
  document.addEventListener("click", e=>{
    const t = e.target.closest("[data-i]");
    if(t && !modal.contains(t)) open(+t.dataset.i);
  });
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape" && modal.classList.contains("open")) close();
    if((e.key==="Enter"||e.key===" ") && e.target.matches("[data-i]")){ e.preventDefault(); open(+e.target.dataset.i); }
  });
  $("#close").addEventListener("click", close);
  modal.addEventListener("click", e=>{ if(e.target===modal) close(); });

  renderHero(); renderGrid();
})();
</script>
</body>
</html>
